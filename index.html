<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Name | Frontend Developer</title>
    <meta
      name="description"
      content="Portfolio of a Frontend Developer building clean, responsive, and user-friendly web applications with React, Next.js, TypeScript, and Tailwind CSS."
    />
    <meta name="author" content="Your Name" />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your Name | Frontend Developer" />
    <meta
      property="og:description"
      content="Building modern and interactive web experiences with React, Next.js, TypeScript, and Tailwind CSS."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var isDark = theme !== 'light';
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view this portfolio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
